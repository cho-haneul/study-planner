<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2"/>
  
  <!-- Glowing AI Sparkle -->
  <path d="M 380 110 Q 380 140 410 140 Q 380 140 380 170 Q 380 140 350 140 Q 380 140 380 110 Z" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Open Book / Plan Icon -->
  <path d="M 256 190 C 215 155 130 155 100 170 L 100 375 C 130 360 215 360 256 395 C 297 360 382 360 412 375 L 412 170 C 382 155 297 155 256 190 Z" fill="#ffffff" fill-opacity="0.95" />
  
  <!-- Spine line -->
  <line x1="256" y1="190" x2="256" y2="395" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Bookmark Ribbon -->
  <path d="M 256 190 L 256 260 L 275 245 L 294 260 L 294 190" fill="#f59e0b"/>

  <!-- Checkmark Badge on right page -->
  <circle cx="340" cy="275" r="28" fill="#10b981"/>
  <path d="M 326 275 L 336 285 L 355 265" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
